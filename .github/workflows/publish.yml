name: Publish Docker image

# Builds a Docker image from one of the owner's private repositories and pushes it to Docker Hub
# and GHCR. This repository is public so its runners are free; the source repositories keep
# Actions switched off and are only ever checked out from here.
#
# Everything a public repository's run produces is readable by anyone: logs, run names, caches
# and artifacts. So this workflow prints as little as it can about the source (quiet builds by
# default), uploads no artifacts or build records, and uses no GitHub Actions cache, which a
# fork's pull request could otherwise read back layer by layer.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Source repository name, under this repository's owner (e.g. msOauth2api)"
        required: true
        type: string
      ref:
        description: "Branch, tag or commit SHA to build"
        required: true
        type: string
      image:
        description: "Image name on Docker Hub and GHCR, lowercase (e.g. msoauth2api)"
        required: true
        type: string
      tag:
        description: "Image tag (v1.0.0, v1.0.0-beta.1, dev-...). Defaults to ref."
        required: false
        type: string
      context:
        description: "Build context, relative to the source repository root"
        required: false
        default: "."
        type: string
      dockerfile:
        description: "Dockerfile, relative to the source repository root"
        required: false
        default: "Dockerfile"
        type: string
      verbose:
        description: "Print the full build log. It is PUBLIC -- use only to debug a failed build."
        required: false
        default: false
        type: boolean

run-name: "publish ${{ inputs.image }}:${{ inputs.tag || inputs.ref }}"

permissions:
  contents: read

# One publish per image at a time, and never cancelled: a half-pushed image is worse than a
# queued one.
concurrency:
  group: publish-${{ inputs.image }}
  cancel-in-progress: false

env:
  # docker/* actions otherwise attach a build summary and upload a build record artifact,
  # both of which would be public here.
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # Validate the inputs and resolve the tag once, so both build jobs use identical values.
  # Inputs are only ever read through env, never interpolated into a script.
  meta:
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.resolve.outputs.repository }}
      semver: ${{ steps.resolve.outputs.semver }}
      channel: ${{ steps.resolve.outputs.channel }}
      ghcr_image: ${{ steps.resolve.outputs.ghcr_image }}
    steps:
      - name: Validate inputs and resolve tag
        id: resolve
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }

          [[ "${REPO}" =~ ^[A-Za-z0-9._-]+$ ]] || fail "repo must be a bare repository name"
          [[ "${REF}" =~ ^[A-Za-z0-9._/-]+$ ]] || fail "ref contains unexpected characters"
          [[ "${IMAGE}" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || fail "image must be a lowercase Docker image name"
          for P in "${CONTEXT}" "${DOCKERFILE}"; do
            [[ "${P}" =~ ^[A-Za-z0-9._/-]+$ && "${P}" != /* && "${P}" != *..* ]] \
              || fail "context and dockerfile must be relative paths inside the repository"
          done

          TAG="${TAG:-${REF}}"
          # dev-*        → dev channel, tag kept as-is
          # any prerelease (-beta.1, -rc.1) → beta channel, v stripped, so `latest` only ever
          #                names a finished version
          # vX.Y.Z       → latest channel, v stripped
          # anything else (a branch name, a SHA) is refused rather than guessed at
          if [[ "${TAG}" =~ ^dev-[A-Za-z0-9._-]+$ ]]; then
            SEMVER="${TAG}"; CHANNEL=dev
          elif [[ "${TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9.-]+$ ]]; then
            SEMVER="${TAG#v}"; CHANNEL=beta
          elif [[ "${TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            SEMVER="${TAG#v}"; CHANNEL=latest
          else
            fail "tag '${TAG}' is not vX.Y.Z, vX.Y.Z-prerelease or dev-*; pass tag explicitly"
          fi

          {
            printf 'repository=%s/%s\n' "${GITHUB_REPOSITORY_OWNER}" "${REPO}"
            printf 'semver=%s\n' "${SEMVER}"
            printf 'channel=%s\n' "${CHANNEL}"
            # GHCR requires a lowercase owner
            printf 'ghcr_image=ghcr.io/%s/%s\n' "${GITHUB_REPOSITORY_OWNER,,}" "${IMAGE}"
          } >> "$GITHUB_OUTPUT"

  # Build each platform natively -- no QEMU, which is painfully slow for native addons.
  # The arm64 runner is free for public repositories, which is half the point of this one.
  build:
    needs: meta
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # The token is a fine-grained PAT with read-only Contents on the source repositories.
      # It is not persisted into the checkout, so nothing in the build can reuse it.
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.meta.outputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Plain `docker buildx build` rather than docker/build-push-action, for control over the
      # output: --progress=quiet keeps the source's build steps out of the public log.
      # --provenance=false because the attestation would record the private repository's
      # details in the published image.
      - name: Build and push platform image
        env:
          DH_IMG: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image }}
          GHCR_IMG: ${{ needs.meta.outputs.ghcr_image }}
          VER: ${{ needs.meta.outputs.semver }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          PROGRESS: ${{ inputs.verbose && 'plain' || 'quiet' }}
        run: |
          set -euo pipefail
          REVISION="$(git -C src rev-parse HEAD)"
          docker buildx build \
            --platform "${PLATFORM}" \
            --file "src/${DOCKERFILE}" \
            --progress "${PROGRESS}" \
            --provenance false \
            --push \
            --tag "${DH_IMG}:${VER}-${SUFFIX}" \
            --tag "${GHCR_IMG}:${VER}-${SUFFIX}" \
            --label "org.opencontainers.image.version=${VER}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            "src/${CONTEXT}" > /dev/null
          echo "Pushed ${VER}-${SUFFIX}"

  # Merge the two platform images into a single multi-arch manifest
  merge:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Always push the versioned tag and the channel alias (latest / beta / dev) to both
      # registries. Per-platform tags were pushed to both in the build job.
      - name: Create and push multi-platform manifests
        env:
          DH_IMG: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image }}
          GHCR_IMG: ${{ needs.meta.outputs.ghcr_image }}
          VER: ${{ needs.meta.outputs.semver }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          set -euo pipefail
          for IMG in "${DH_IMG}" "${GHCR_IMG}"; do
            docker buildx imagetools create \
              -t "${IMG}:${VER}" \
              -t "${IMG}:${CHANNEL}" \
              "${IMG}:${VER}-amd64" \
              "${IMG}:${VER}-arm64"
          done
          echo "Published ${VER} (${CHANNEL})" >> "$GITHUB_STEP_SUMMARY"
